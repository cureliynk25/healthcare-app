name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - "CureliynkMedical/backend/**"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "CureliynkMedical/backend/**"
      - ".github/workflows/backend-ci.yml"


permissions:
  contents: read


jobs:

  test:
    name: Backend Tests
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: test

      MONGODB_URI: mongodb://test:test@localhost:27017
      MONGODB_DATABASE: test_database
      MONGODB_COLLECTION: test_doctors

      PINECONE_API_KEY: test-pinecone-key
      GOOGLE_MAPS_API_KEY: test-google-key

      GEMINI_API_KEY: test-gemini-key
      ANTHROPIC_API_KEY: test-anthropic-key
      DEEPSEEK_API_KEY: test-deepseek-key

    defaults:
      run:
        working-directory: CureliynkMedical/backend

    steps:

      # 1. Download repository code
      - name: Checkout repository
        uses: actions/checkout@v4


      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: CureliynkMedical/backend/requirements.txt


      # 3. Upgrade pip
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip


      # 4. Install backend dependencies
      - name: Install dependencies
        run: |
          pip install -r requirements.txt


      # 5. Run automated tests
      - name: Run tests
        run: |
          python -m pytest -v


  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:

      # 1. Download repository code
      - name: Checkout repository
        uses: actions/checkout@v4


      # 2. Build backend Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t cureliynk-backend:ci \
            ./CureliynkMedical/backend