name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - "CureliynkMedical/backend/**"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "CureliynkMedical/backend/**"
      - ".github/workflows/backend-ci.yml"


permissions:
  contents: read


jobs:

  # JOB 1: BACKEND TESTS

  test:
    name: Backend Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      ENVIRONMENT: test

      MONGODB_URI: mongodb://test:test@localhost:27017
      MONGODB_DATABASE: test_database
      MONGODB_COLLECTION: test_doctors

      PINECONE_API_KEY: test-pinecone-key
      GOOGLE_MAPS_API_KEY: test-google-key

      GEMINI_API_KEY: test-gemini-key
      ANTHROPIC_API_KEY: test-anthropic-key
      DEEPSEEK_API_KEY: test-deepseek-key

    defaults:
      run:
        working-directory: CureliynkMedical/backend

    steps:

      # 1. Download repository code
      - name: Checkout repository
        uses: actions/checkout@v4


      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: CureliynkMedical/backend/requirements.txt


      # 3. Upgrade pip
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip


      # 4. Install backend dependencies
      - name: Install dependencies
        run: |
          pip install -r requirements.txt


      # 5. Run automated tests
      - name: Run tests
        run: |
          python -m pytest -v

  # JOB 2: BUILD + PUBLISH DOCKER IMAGE

  docker-build:
    name: Docker Build and Publish
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: cureliynk25/healthcare-app-backend

    steps:

      # 1. Download repository code
      - name: Checkout repository
        uses: actions/checkout@v4


      # 2. Login to GitHub Container Registry
      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # 3. Build Docker image
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./CureliynkMedical/backend

          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}